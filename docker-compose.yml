version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: algo-trader-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Reena2220
      POSTGRES_DB: algotrader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  algo-trader:
    build: .
    container_name: algo-trader-bot
    environment:
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ALPACA_BASE_URL: ${ALPACA_BASE_URL}
      DATABASE_URL: postgresql://postgres:Reena2220@postgres:5432/algotrader
      TRADING_SYMBOLS: ${TRADING_SYMBOLS:-SPY,QQQ,AAPL}
      MAX_POSITION_SIZE: ${MAX_POSITION_SIZE:-0.10}
      MAX_DAILY_LOSS: ${MAX_DAILY_LOSS:-0.03}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      DASHBOARD_PORT: 5000
      ENV: paper
      LOG_LEVEL: INFO
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - algo-trader-network

volumes:
  postgres_data:

networks:
  algo-trader-network:
    driver: bridge
